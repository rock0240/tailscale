name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 */6 * * *'

permissions:
  actions: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight Check
        id: preflight
        run: |
          current_run_id="${{ github.run_id }}"

          # Get all in_progress and queued run IDs
          in_progress_ids=$(gh run list --workflow ci.yml --status in_progress --json databaseId --repo ${{ github.repository }} 2>/dev/null | jq -r '.[].databaseId' 2>/dev/null || echo "")
          queued_ids=$(gh run list --workflow ci.yml --status queued --json databaseId --repo ${{ github.repository }} 2>/dev/null | jq -r '.[].databaseId' 2>/dev/null || echo "")

          # Count OTHER runs (exclude current)
          other_count=0
          for id in $in_progress_ids $queued_ids; do
            if [ "$id" != "$current_run_id" ]; then
              other_count=$((other_count + 1))
            fi
          done

          echo "Current run: $current_run_id | Other active runs: $other_count"

          if [ "$other_count" -gt 0 ]; then
            echo "Another run already active. Stopping this one."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No other runs. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Test Environment
        if: steps.preflight.outputs.skip != 'true'
        run: |
          chmod +x scripts/test-env.sh
          ./scripts/test-env.sh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Run E2E Test Suite
        if: steps.preflight.outputs.skip != 'true'
        run: |
          # Randomized test cycle duration (300-350 minutes)
          BASE=18000
          JITTER=$((RANDOM % 3000))
          TOTAL=$((BASE + JITTER))

          end_time=$((SECONDS + TOTAL))
          cycle=0
          FAIL_COUNT=0
          MAX_FAILURES=5

          echo "Test suite started at $(date -u)"
          echo "Estimated duration: $((TOTAL / 60))m"

          while [ $SECONDS -lt $end_time ]; do
            cycle=$((cycle + 1))
            remaining=$(( (end_time - SECONDS) / 60 ))

            echo "[#${cycle}] $(date -u) | ${remaining}m remaining"

            # Verify test services are healthy
            if command -v tailscale &> /dev/null; then
              ts_status=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.Online // "unknown"' 2>/dev/null || echo "check_failed")
              echo "  node: $ts_status"

              if [ "$ts_status" != "true" ]; then
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "  health: degraded ($FAIL_COUNT/$MAX_FAILURES)"

                if [ "$FAIL_COUNT" -ge "$MAX_FAILURES" ]; then
                  echo "  Reconnecting..."
                  sudo tailscale down 2>/dev/null || true
                  sleep 5
                  sudo tailscale up --auth-key="${TAILSCALE_AUTH_KEY}" --hostname=exit-node --advertise-exit-node --accept-routes --advertise-tags=tag:usa --ssh 2>/dev/null || true
                  FAIL_COUNT=0
                fi
              else
                FAIL_COUNT=0
              fi
            fi

            sleep 60
          done

          echo "Test cycle completed at $(date -u)"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Trigger Next Run
        if: always() && steps.preflight.outputs.skip != 'true'
        run: |
          echo "Triggering next run..."
          gh workflow run ci.yml --repo ${{ github.repository }} 2>/dev/null && echo "Next run triggered." || echo "Trigger failed. Cron backup will handle it."
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Cleanup Old Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
        continue-on-error: true
